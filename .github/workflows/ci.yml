name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall qc_core services scripts evals cli.py
      - name: Generate data
        run: python scripts/generate_data.py
      - name: Tests
        run: python -m pytest tests -q
      - name: Eval
        run: python scripts/run_eval.py
      - name: Validate Kubernetes manifests
        run: python -c "import yaml, glob; [yaml.safe_load_all(open(p)) for p in glob.glob('k8s/*.yaml')]; print('k8s yaml ok')"
