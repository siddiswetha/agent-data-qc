apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      containers:
        - name: validator
          image: agent-data-qc-validator:latest
          ports:
            - containerPort: 8102
          env:
            - name: PORT
              value: "8102"
---
apiVersion: v1
kind: Service
metadata:
  name: validator
spec:
  selector:
    app: validator
  ports:
    - port: 8102
      targetPort: 8102
