services:
  intake:
    build:
      context: .
      dockerfile: services/intake/Dockerfile
    ports:
      - "8101:8101"
    environment:
      - PORT=8101
      - QC_DB=/app/intake.db
  validator:
    build:
      context: .
      dockerfile: services/validator/Dockerfile
    ports:
      - "8102:8102"
    environment:
      - PORT=8102
      - QC_DB=/app/validator.db
  auditor:
    build:
      context: .
      dockerfile: services/auditor/Dockerfile
    ports:
      - "8103:8103"
    environment:
      - PORT=8103
      - QC_DB=/app/auditor.db
